<style>
/* Layout: list of quotations -> editor (areas + items on the left, margin & totals panel pinned on the right) */
:root{
  --bg:#edefec; --surface:#fbfbfa; --ink:#18191a; --muted:#646a66; --line:#d5dad5; --field:#ffffff;
  --accent:#1f3864; --accent-ink:#ffffff; --sage:#bfcdbb; --beige:#eee6dd; --beige-2:#f5efe6;
  --ok:#1d6b45; --warn:#9a5b00; --danger:#a3262a; --computed:#8a8f8b;
  --f-display:"Marcellus",Georgia,serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1a1d1b; --ink:#eceeec; --muted:#9ca29e; --line:#2d322f; --field:#141715;
  --accent:#9fb4e6; --accent-ink:#0d1630; --sage:#4b5a48; --beige:#3a332b; --beige-2:#2c2721;
  --ok:#7fd1a6; --warn:#f0b35a; --danger:#ef8a8d; --computed:#7f8581; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1a1d1b; --ink:#eceeec; --muted:#9ca29e; --line:#2d322f; --field:#141715;
  --accent:#9fb4e6; --accent-ink:#0d1630; --sage:#4b5a48; --beige:#3a332b; --beige-2:#2c2721;
  --ok:#7fd1a6; --warn:#f0b35a; --danger:#ef8a8d; --computed:#7f8581; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;cursor:pointer}
.logo-ink{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-ink{filter:invert(1)}}
:root[data-theme="dark"] .logo-ink{filter:invert(1)}
.btn{font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{font-size:12.5px;padding:5px 10px;border-radius:7px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:18px;padding-block:16px 80px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar img{width:36px}
.topbar h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.topbar .sp{flex:1}
.topbar nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.topbar nav a{color:var(--ink);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* list */
.list-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.list-head h2{margin:0;margin-right:auto}
.list-head input{width:240px}
.qtbl{overflow-x:auto}
.qtbl table{width:100%;border-collapse:collapse;min-width:760px}
.qtbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}
.qtbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.qtbl tr.open-row{cursor:pointer}
.qtbl tr.open-row:hover td{background:var(--beige-2)}
.qtbl .r{text-align:right}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--beige);color:var(--ink)}
.chip.sent{background:var(--sage)}
.chip.approved{background:var(--accent);color:var(--accent-ink)}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* editor */
.ed-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ed-head .ttl{display:grid;margin-right:auto;min-width:0}
.ed-head .ttl b{font-family:var(--f-display);font-weight:400;font-size:22px;overflow-wrap:anywhere}
.ed-head .ttl span{font-size:12.5px;color:var(--muted)}
.save-state{font-size:12px;color:var(--muted);min-width:70px}
.save-state.err{color:var(--danger)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:16px;align-items:start}
@media (max-width:1100px){.ed-grid{grid-template-columns:minmax(0,1fr)}}
.ed-main{display:grid;gap:14px;min-width:0}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
@media (max-width:1100px){.aside{position:static}}
.det{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.det label,.set label{display:grid;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.det input,.det select{text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;color:var(--ink)}
.sec-title{display:flex;align-items:center;gap:10px;background:var(--beige);border-radius:8px;padding:8px 12px;font-weight:700;letter-spacing:.02em}
.sec-title .tot{margin-left:auto;font-weight:600;font-size:13px}
.area{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.area-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--beige-2);border-radius:10px 10px 0 0}
.area-head .aname{font-weight:700;font-size:15px;flex:1 1 220px}
.area-head .am{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.area-head .am input{width:70px}
.area-head .atot{font-size:12.5px;color:var(--muted);white-space:nowrap}
.area-head .atot b{color:var(--ink)}
.tw{overflow-x:auto}
table.items{border-collapse:collapse;width:100%;min-width:960px;table-layout:fixed}
table.items th{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
table.items th.grp-v{color:var(--ink)}
table.items td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.items tr:last-child td{border-bottom:0}
table.items input,table.items select{width:100%;padding:6px 5px;font-size:13.5px}
table.items select{padding-right:2px}
table.items th,table.items td{overflow:hidden}
table.items .n input{text-align:right;font-variant-numeric:tabular-nums}
table.items .sr{width:30px;text-align:center;color:var(--muted);font-size:12px}
table.items .c-item{min-width:230px}
table.items .c-unit{width:76px}
table.items .c-dim{width:66px}
table.items .c-q{width:74px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-right:8px}
table.items .c-amt{width:112px}
table.items .c-rate{width:96px}
table.items .c-m{width:62px}
table.items .c-cr{width:84px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
table.items .c-ca{width:104px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;padding-right:8px}
table.items .c-act{width:118px;white-space:nowrap;text-align:right}
table.items input::placeholder{color:var(--computed);font-style:italic;opacity:1}
table.items input.drive{border-color:var(--accent);font-weight:600}
table.items input.miss{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--field))}
table.items input:disabled{opacity:.35}
.ib{border:1px solid transparent;background:transparent;border-radius:6px;width:22px;height:26px;padding:0;color:var(--muted);font-size:14px;line-height:1}
.ib:hover{border-color:var(--line);color:var(--ink)}
.ib.del:hover{color:var(--danger)}
.area-foot{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--accent);vertical-align:-1px;margin-right:4px}
.legend i.pl{border-color:var(--line);background:var(--field)}
/* aside */
.set{display:grid;gap:10px}
.set .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set input,.set select{text-transform:none;font-weight:500;font-size:14px;color:var(--ink);letter-spacing:0}
.tot-tbl{display:grid;gap:2px;font-size:13.5px}
.tot-tbl div{display:flex;justify-content:space-between;gap:10px;padding:4px 2px}
.tot-tbl div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.tot-tbl .sub{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.tot-tbl .grand{background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:8px 10px;font-weight:700;margin-top:4px}
.tot-tbl .profit{background:var(--sage);border-radius:7px;padding:8px 10px;margin-top:6px}
.tot-tbl .profit span{font-weight:700}
.exp{display:grid;gap:8px}
.exp label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
/* terms */
.pay-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px 30px;gap:6px;align-items:center;margin-bottom:6px}
.pay-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.terms-grid{display:grid;gap:12px}
.terms-grid label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--warn);font-weight:600}
.okline{font-size:12.5px;color:var(--ok);font-weight:600}
/* gate + toast */
.gate{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:24px}
.gate img{width:min(260px,70vw)}
.gate p{color:var(--muted);margin:0;max-width:36ch}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="gate" id="gate">
  <img class="logo-ink" id="gateLogo" alt="Antariksha Interiors">
  <p id="gateMsg">Loading…</p>
  <button class="btn primary" id="signIn" type="button" hidden>Sign in with Google</button>
</div>

<div class="wrap" id="app" hidden>
  <header class="topbar">
    <img class="logo-ink" id="hdrMark" alt="">
    <h1>Quotations</h1>
    <span class="sp"></span>
    <nav><a href="./">Receipts</a><span id="who"></span><button class="btn sm ghost" id="signOut" type="button">Sign out</button></nav>
  </header>

  <!-- LIST -->
  <section id="listView">
    <div class="card">
      <div class="list-head">
        <h2>All quotations</h2>
        <input type="search" id="q" placeholder="Search client, site, number" aria-label="Search quotations">
        <button class="btn" id="importBtn" type="button">Import from Excel</button>
        <input type="file" id="importFile" accept=".xlsx,.xlsm" hidden>
        <button class="btn primary" id="newBtn" type="button">New quotation</button>
      </div>
      <div class="qtbl"><table>
        <thead><tr><th>Quotation no.</th><th>Client</th><th>Site</th><th>Date</th><th>Status</th><th class="r">Vendor total</th><th class="r">Client total</th><th class="r">Profit</th><th></th></tr></thead>
        <tbody id="qList"></tbody>
      </table></div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="edView" hidden>
    <div class="ed-head">
      <button class="btn sm" id="backBtn" type="button">← All quotations</button>
      <div class="ttl"><b id="edTitle"></b><span id="edSub"></span></div>
      <select id="edStatus" aria-label="Status"><option value="draft">Draft</option><option value="sent">Sent to client</option><option value="approved">Approved</option></select>
      <span class="save-state" id="saveState"></span>
    </div>
    <div class="ed-grid">
      <div class="ed-main" id="edMain"></div>
      <aside class="aside" id="edAside"></aside>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

let toastT;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3600)}
const newRow=(unit="Sq.ft")=>({id:uid(),item:"",unit,l:null,w:null,nos:null,amt:null,rate:null,basis:"amt",margin:null});
const newArea=(name="")=>({id:uid(),name,margin:null,items:[newRow()]});

/* ===================== calculation engine ===================== */
function qtyOf(r){const l=+r.l||0,w=+r.w||0,n=+r.nos||0,mul=n>0?n:1;
  switch(r.unit){case"LS":return 1;case"Nos":return n;case"Rft":return l*mul;default:return l*w*mul}}
function vendorAmt(r){return r.basis==="rate"?qtyOf(r)*(+r.rate||0):(+r.amt||0)}
function marginOf(r,area,q){if(has(r.margin))return +r.margin;if(area&&has(area.margin))return +area.margin;return +q.settings.margin||0}
function clientAmt(v,m,R){R=Math.max(1,+R||1);return Math.round(v*(1+m/100)/R)*R}
function compute(q){
  const S=q.settings,rows={},areas={};let Av=0,Ac=0,Bv=0,Bc=0;
  const one=(r,area)=>{const qty=qtyOf(r),v=vendorAmt(r),m=marginOf(r,area,q),c=v?clientAmt(v,m,S.roundTo):0;
    const o={qty,v,vr:qty?v/qty:null,m,c,cr:qty?c/qty:null,filled:!!r.item.trim()};rows[r.id]=o;return o};
  for(const a of q.areas){let v=0,c=0;for(const r of a.items){const o=one(r,a);if(o.filled){v+=o.v;c+=o.c}}areas[a.id]={v,c};Av+=v;Ac+=c}
  for(const r of q.services){const o=one(r,null);if(o.filled){Bv+=o.v;Bc+=o.c}}
  const vendorTotal=Av+Bv,sub=Ac+Bc;
  const dv=+S.designValue||0;
  const design=S.designMode==="fixed"?Math.round(dv):Math.round((S.designMode==="pctVendor"?vendorTotal:sub)*dv/100);
  const disc=Math.round(sub*(+S.discount||0)/100);
  const gst=Math.round((sub+design-disc)*(+S.gst||0)/100);
  const grand=sub+design-disc+gst;
  const profit=sub+design-disc-vendorTotal;
  const payments=(q.terms.payments||[]).map(p=>({...p,amt:Math.round(grand*(+p.pct||0)/100)}));
  const paySum=(q.terms.payments||[]).reduce((a,p)=>a+(+p.pct||0),0);
  return {rows,areas,Av,Ac,Bv,Bc,vendorTotal,sub,design,disc,gst,grand,profit,profitPct:vendorTotal?profit/vendorTotal*100:0,payments,paySum};
}

/* ===================== state ===================== */
let fs=null,auth=null,quotes=[],cur=null,defaults=null,saveT=null,dirty=false;
function blankQuote(no){
  const d=defaults||{};
  return {id:"q"+Date.now().toString(36)+uid().slice(0,4),no:no||"",status:"draft",
    date:todayISO(),client:{...DEF_CLIENT,...(d.client||{}),name:"",site:"",type:"",subType:""},
    settings:{...DEF_SETTINGS,...(d.settings||{})},
    areas:[newArea("")],services:[],terms:clone(d.terms||DEF_TERMS),createdAt:Date.now(),updatedAt:Date.now()};
}
function normalize(q){
  q.client={...DEF_CLIENT,...(q.client||{})};q.settings={...DEF_SETTINGS,...(q.settings||{})};
  q.areas=q.areas||[];q.services=q.services||[];q.terms={...clone(DEF_TERMS),...(q.terms||{})};
  for(const a of q.areas){a.items=a.items||[];for(const r of a.items)Object.assign(r,{...newRow(),...r,id:r.id||uid()})}
  for(const r of q.services)Object.assign(r,{...newRow("LS"),...r,id:r.id||uid()});
  return q;
}

/* ===================== saving ===================== */
function setSave(t,err){const e=$("saveState");e.textContent=t;e.className="save-state"+(err?" err":"")}
function scheduleSave(){dirty=true;setSave("Unsaved…");clearTimeout(saveT);saveT=setTimeout(saveNow,1000)}
async function saveNow(){
  if(!cur||!fs)return;clearTimeout(saveT);
  const C=compute(cur);cur.updatedAt=Date.now();cur.summary={vendor:C.vendorTotal,grand:C.grand,profit:C.profit};
  setSave("Saving…");
  try{await fs.doc("quotes/"+cur.id).set(JSON.parse(JSON.stringify(cur)));dirty=false;setSave("Saved")}
  catch(e){setSave("Not saved – check internet",true)}
}
window.addEventListener("beforeunload",e=>{if(dirty){saveNow();e.preventDefault();e.returnValue=""}});
async function nextQuoteNo(){
  const yr=new Date().getFullYear();
  try{const ref=fs.doc("meta/quoteCounter");
    const n=await fs.runTransaction(async t=>{const s=await t.get(ref);let n=s.exists?(+s.data().next||1):1;
      const used=new Set(quotes.map(x=>x.no));while(used.has(`AI/Q/${yr}/${String(n).padStart(3,"0")}`))n++;t.set(ref,{next:n+1});return n});
    return `AI/Q/${yr}/${String(n).padStart(3,"0")}`}
  catch(e){return `AI/Q/${yr}/${String(quotes.length+1).padStart(3,"0")}`}
}

$("qList").addEventListener("click",async e=>{
  const dup=e.target.closest("[data-dup]"),del=e.target.closest("[data-del]"),op=e.target.closest("[data-open]");
  if(dup){e.stopPropagation();const src=quotes.find(x=>x.id===dup.dataset.dup);if(!src)return;
    const q=normalize(clone(src));q.id="q"+Date.now().toString(36)+uid().slice(0,4);q.no=await nextQuoteNo();q.status="draft";q.date=todayISO();q.client.name=(q.client.name||"")+" (copy)";q.createdAt=Date.now();

  if(del){e.stopPropagation();if(!del.dataset.armed){del.dataset.armed=1;del.textContent="Confirm delete";setTimeout(()=>{if(del.isConnected){delete del.dataset.armed;del.textContent="Delete"}},4000);return}
    try{await fs.doc("quotes/"+del.dataset.del).delete();toast("Deleted")}catch(err){toast("Could not delete. Try again.")}return}
  if(op){const q=quotes.find(x=>x.id===op.dataset.open);if(q)openQuote(normalize(clone(q)))}
});

/* live update of computed cells (keeps focus while typing) */
function refresh(){
  const q=cur,C=compute(q);
  document.querySelectorAll("#edMain tr[data-row]").forEach(tr=>{
    const r=findRow(tr.dataset.row);if(!r)return;const o=C.rows[r.id];
    const qtyLbl=r.unit==="LS"?"LS":r.unit==="Nos"?fmtIn(o.qty)+" nos":fmtIn(o.qty)+(r.unit==="Rft"?" rft":"");
    tr.querySelector('[data-c="qty"]').textContent=o.qty||r.unit==="LS"?qtyLbl:"—";
    const ia=tr.querySelector('[data-f="amt"]'),ir=tr.querySelector('[data-f="rate"]'),im=tr.querySelector('[data-f="margin"]');
    ia.classList.toggle("drive",r.basis==="amt"&&has(r.amt));ir.classList.toggle("drive",r.basis==="rate"&&has(r.rate));
    ia.placeholder=r.basis==="rate"&&o.v?inr(o.v):"";
    ir.placeholder=r.unit==="LS"?"":r.basis==="amt"&&o.vr!=null&&o.v?fmtIn(o.vr):(r.basis==="amt"&&o.v&&!o.qty?"size?":"");
    const ii=tr.querySelector('[data-f="item"]');ii.title=r.item;
    im.placeholder=fmtIn(o.m);
    const filled=r.item.trim();
    const missPrice=filled&&!o.v;const missSize=filled&&r.basis==="rate"&&has(r.rate)&&!o.qty;
    ia.classList.toggle("miss",missPrice&&r.basis==="amt");ir.classList.toggle("miss",(missPrice&&r.basis==="rate")||missSize);
    tr.querySelector('[data-c="cr"]').textContent=o.cr!=null&&o.c&&r.unit!=="LS"?inr(o.cr):"";
    tr.querySelector('[data-c="ca"]').textContent=o.c?inr(o.c):"";
  });
  document.querySelectorAll("#edMain .area[data-area]").forEach(el=>{const a=C.areas[el.dataset.area];const t=el.querySelector("[data-atot]");
    if(a&&t)t.innerHTML=`Vendor <b>${rs(a.v)}</b> → Client <b>${rs(a.c)}</b>`});
  document.querySelectorAll('#edMain [data-af="margin"]').forEach(i=>i.placeholder=fmtIn(+q.settings.margin||0));
  $("totA").textContent=`Vendor ${rs(C.Av)}  →  Client ${rs(C.Ac)}`;
  $("totB").textContent=`Vendor ${rs(C.Bv)}  →  Client ${rs(C.Bc)}`;
  const S=q.settings,dl=S.designMode==="fixed"?"Design charges":`Design charges (${fmtIn(+S.designValue||0)}%)`;
  $("totTbl").innerHTML=`
    <div><span>Vendor total (your cost)</span><span>${rs(C.vendorTotal)}</span></div>
    <div class="sub"><span>A. Furniture</span><span>${rs(C.Ac)}</span></div>
    <div><span>B. Additional services</span><span>${rs(C.Bc)}</span></div>
    <div><span><b>Client sub-total (A + B)</b></span><span>${rs(C.sub)}</span></div>
    <div><span>+ ${dl}</span><span>${rs(C.design)}</span></div>
    ${C.disc?`<div><span>− Discount (${fmtIn(+S.discount)}%)</span><span>${rs(-C.disc)}</span></div>`:""}
    ${C.gst?`<div><span>+ GST (${fmtIn(+S.gst)}%)</span><span>${rs(C.gst)}</span></div>`:""}
    <div class="grand"><span>Grand total (client)</span><span>${rs(C.grand)}</span></div>
    <div class="profit"><span>Your profit (before GST)</span><span>${rs(C.profit)}</span></div>
    <div><span>Profit % on vendor cost</span><span>${fmtIn(C.profitPct)}%</span></div>`;
  document.querySelectorAll("#payRows [data-pay]").forEach((el,i)=>{const p=C.payments[i];el.querySelector("[data-pamt]").textContent=p?rs(p.amt):""});
  const pc=$("payCheck");if(pc){const ok=Math.abs(C.paySum-100)<0.001;pc.className=ok?"okline":"warnline";pc.textContent=ok?"Stages add up to 100%":`Stages add up to ${fmtIn(C.paySum)}%. They should add up to 100%.`}
  $("edTitle").textContent=q.client.name||"Untitled quotation";
  $("edSub").textContent=[q.no,q.client.site,typeLabel(q.client),fmtDate(q.date)].filter(Boolean).join("  ·  ");
}
const ownerOf=new WeakMap();
function findRow(id){for(const a of cur.areas)for(const r of a.items)if(r.id===id){ownerOf.set(r,a.items);return r}
  for(const r of cur.services)if(r.id===id){ownerOf.set(r,cur.services);return r}return null}
function listOf(r){return ownerOf.get(r)||cur.services}

function onInput(e){
  const t=e.target;if(!cur)return;
  if(t.dataset.k){setPath(cur,t.dataset.k,t.value);
    if(t.dataset.k==="client.type"){const d=$("dlSub");if(d)d.innerHTML=opts(subTypeSuggestions(t.value))}
    refresh();scheduleSave();return}
  if(t.dataset.s){const k=t.dataset.s;cur.settings[k]=k==="designMode"?t.value:num(t.value);
    if(k==="designMode"){const l=$("dvLbl");if(l)l.firstChild.textContent=t.value==="fixed"?"Design charges ₹":"Design charges %"}
    refresh();scheduleSave();return}
  if(t.dataset.t){cur.terms[t.dataset.t]=t.value;scheduleSave();return}
  if(t.dataset.p){const i=+t.closest("[data-pay]").dataset.pay;const p=cur.terms.payments[i];p[t.dataset.p]=t.dataset.p==="pct"?num(t.value):t.value;refresh();scheduleSave();return}
  if(t.dataset.af){const a=cur.areas.find(x=>x.id===t.closest("[data-area]").dataset.area);if(!a)return;a[t.dataset.af]=t.dataset.af==="margin"?num(t.value):t.value;refresh();scheduleSave();return}
  if(t.dataset.f){const tr=t.closest("tr[data-row]");const r=findRow(tr.dataset.row);if(!r)return;const f=t.dataset.f;
    if(f==="item"){r.item=t.value}
    else if(f==="unit"){if(e.type!=="change")return;r.unit=t.value;
      const dl=r.unit==="LS"||r.unit==="Nos",dw=r.unit!=="Sq.ft",dn=r.unit==="LS";
      tr.querySelector('[data-f="l"]').disabled=dl;tr.querySelector('[data-f="w"]').disabled=dw;tr.querySelector('[data-f="nos"]').disabled=dn}
    else if(f==="amt"){r.amt=num(t.value);if(has(t.value)){r.basis="amt";r.rate=null;tr.querySelector('[data-f="rate"]').value=""}}
    else if(f==="rate"){r.rate=num(t.value);if(has(t.value)){r.basis="rate";r.amt=null;tr.querySelector('[data-f="amt"]').value=""}}
    else r[f]=num(t.value);
    refresh();scheduleSave()}
}
/* ---------- buttons ---------- */
$("edMain").addEventListener("click",onClick);$("edAside").addEventListener("click",onClick);
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}
function focusRow(id,f="item"){const el=document.querySelector(`tr[data-row="${id}"] [data-f="${f}"]`);if(el)el.focus()}
async function onClick(e){
  const b=e.target.closest("button");if(!b||!cur)return;
  if(b.dataset.act){const r=findRow(b.closest("tr").dataset.row);const L=listOf(r);const i=L.indexOf(r);
    if(b.dataset.act==="up")move(L,i,-1);if(b.dataset.act==="down")move(L,i,1);
    let focus=null;
    if(b.dataset.act==="ins"){const n=newRow(r.unit);L.splice(i+1,0,n);focus=n.id}
    if(b.dataset.act==="dupr"){const n={...clone(r),id:uid()};L.splice(i+1,0,n);focus=n.id}
    if(b.dataset.act==="delr"){L.splice(i,1)}
    renderEditor();scheduleSave();if(focus)focusRow(focus);return}
  if(b.dataset.aact){const ai=cur.areas.findIndex(x=>x.id===b.closest("[data-area]").dataset.area);const a=cur.areas[ai];
    if(b.dataset.aact==="aup")move(cur.areas,ai,-1);if(b.dataset.aact==="adown")move(cur.areas,ai,1);
    if(b.dataset.aact==="addr"){const n=newRow(a.items.at(-1)?.unit||"Sq.ft");a.items.push(n);renderEditor();scheduleSave();focusRow(n.id);return}
    if(b.dataset.aact==="adel"){if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Confirm: delete area and its items";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Delete area"}},4000);return}
      cur.areas.splice(ai,1)}
    renderEditor();scheduleSave();return}
  if(b.dataset.pdel!==undefined){cur.terms.payments.splice(+b.dataset.pdel,1);renderPays();refresh();scheduleSave();return}
  const g=b.dataset.gact;if(!g)return;
  if(g==="addArea"){const a=newArea("");cur.areas.push(a);renderEditor();scheduleSave();const el=document.querySelector(`[data-area="${a.id}"] .aname`);if(el){el.focus();el.scrollIntoView({block:"center"})}}
  if(g==="addSvc"){const n=newRow("LS");cur.services.push(n);renderEditor();scheduleSave();focusRow(n.id)}
  if(g==="addPay"){cur.terms.payments.push({label:"",pct:0});renderPays();refresh();scheduleSave()}
  if(g==="resetTerms"){cur.terms=clone((defaults&&defaults.terms)||DEF_TERMS);renderEditor();scheduleSave();toast("Terms reset")}
  if(g==="saveDefaults"){defaults={settings:clone(cur.settings),terms:clone(cur.terms),client:{preparedBy:cur.client.preparedBy,contact:cur.client.contact}};
    try{await fs.doc("settings/quoteDefaults").set(defaults);toast("New quotations will start with these terms and settings")}catch(err){toast("Could not save defaults")}}
  if(g==="pdfClient"){await saveNow();try{makeClientPDF(cur)}catch(err){console.error(err);toast("Could not make the PDF: "+err.message)}}
  if(g==="pdfVendor"){await saveNow();try{makeVendorPDF(cur,$("measOnly").checked)}catch(err){console.error(err);toast("Could not make the PDF: "+err.message)}}
}
</script>
<script>
/* ===================== PDF ===================== */
const BEIGE=[238,230,221],SAGE=[191,205,187],NAVY=[0,32,96],BLK=[1,1,1],SUBT=[245,239,230],SUBT_INK=[31,56,100],GRID=[175,175,175];
const PL=10,PW=190;
function newDoc(){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  for(const [st,b64] of Object.entries(FONTS)){const fn="Carlito-"+st+".ttf";doc.addFileToVFS(fn,b64);doc.addFont(fn,"Carlito",st)}
  doc.setFont("Carlito","normal");return doc;
}
function brandHeader(doc){
  doc.setFillColor(...BEIGE);doc.rect(PL,10,PW,33,"F");
  const w=68,h=w*WM_H/WM_W;doc.addImage(WORDMARK,"PNG",105-w/2,15,w,h);
  doc.setFont("Carlito","italic");doc.setFontSize(10);doc.setTextColor(0);doc.text("Interior Design & Turnkey Execution",105,39,{align:"center"});
  return 47;
}
function bar(doc,y,text,fill,opts={}){
  y=room(doc,y,opts.need||14);
  doc.setFillColor(...fill);doc.rect(PL,y,PW,6.2,"F");doc.setFont("Carlito","bold");doc.setFontSize(opts.size||10);doc.setTextColor(...(opts.ink||[0,0,0]));
  doc.text(text,PL+(opts.indent??2),y+4.4);return y+6.2;
}
function room(doc,y,need){if(y+need>282){doc.addPage();return 14}return y}
function footer(doc,label){
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("Carlito","normal");doc.setFontSize(7.5);doc.setTextColor(120);
    doc.text(`Antariksha Interiors  ·  ${label}`,PL,291);doc.text(`Page ${i} of ${n}`,PL+PW,291,{align:"right"})}
}
const T=(doc,opts)=>{doc.autoTable({theme:"plain",margin:{left:PL,right:PL,top:14,bottom:12},
  styles:{font:"Carlito",fontSize:9,textColor:[0,0,0],cellPadding:{top:1.1,bottom:1.1,left:1.6,right:1.6},overflow:"linebreak",valign:"middle"},...opts});return doc.lastAutoTable.finalY};
const gridCell={lineWidth:0.12,lineColor:GRID};
function detailsBlock(doc,y,pairs){
  y=bar(doc,y,"CLIENT & PROJECT DETAILS",SAGE,{size:10.5,indent:1});
  return T(doc,{startY:y+1,body:pairs.map(([k,v])=>[k,v]),columnStyles:{0:{cellWidth:74,fontStyle:"bold",cellPadding:{left:16,top:1,bottom:1}},1:{fontStyle:"bold"}},styles:{font:"Carlito",fontSize:10,cellPadding:1}})+4;
}
function fmtDim(x){return has(x)&&+x?f2(+x):""}
function itemCells(r,o,sr,mode){
  const sq=r.unit==="Sq.ft"||r.unit==="Rft";
  const qtyCol=r.unit==="Nos"?fmtIn(o.qty):(has(r.nos)&&+r.nos&&r.unit!=="LS"?fmtIn(+r.nos):"");
  const base=[{content:String(sr),styles:{halign:"center"}},r.item,{content:r.unit,styles:{halign:"center"}},
    {content:r.unit==="LS"||r.unit==="Nos"?"":fmtDim(r.l),styles:{halign:"center"}},{content:r.unit==="Sq.ft"?fmtDim(r.w):"",styles:{halign:"center"}},
    {content:qtyCol,styles:{halign:"center"}},{content:sq&&o.qty?f2(o.qty):"",styles:{halign:"center"}}];
  let rate="",amt="";
  if(mode==="client"){rate=r.unit==="LS"?"":(o.cr!=null&&o.c?rs(o.cr):"");amt=o.c?rs(o.c):""}
  else if(mode==="vendor"){rate=r.unit==="LS"?"":(o.vr!=null&&o.v?rs(o.vr):"");amt=o.v?rs(o.v):""}
  return base.concat([{content:rate,styles:{halign:"center"}},{content:amt,styles:{halign:"right",fontStyle:"bold"}}]).map(c=>typeof c==="object"?{...c,styles:{...gridCell,...c.styles}}:{content:c,styles:{...gridCell}});
}
const COLS9={0:{cellWidth:11},1:{cellWidth:"auto"},2:{cellWidth:12},3:{cellWidth:15},4:{cellWidth:15},5:{cellWidth:11},6:{cellWidth:15},7:{cellWidth:21},8:{cellWidth:23}};
function headRow(labels){return [labels.map((l,i)=>({content:l,styles:{fillColor:SAGE,fontStyle:"bold",halign:i===1?"left":"center",fontSize:8.5,...gridCell}}))]}
function sectionA(doc,y,q,C,mode){
  const areas=q.areas.map(a=>({a,items:a.items.filter(r=>r.item.trim())})).filter(x=>x.items.length);
  if(!areas.length)return y;
  y=bar(doc,y,"A.  FURNITURE (Carpentry Work)",BEIGE,{need:30,indent:22});
  const head=headRow(["Sr.No.","Item","Unit","Length (ft)","Width (ft)","Qty","Sq.ft",mode==="measure"?"Rate (Rs.)":"Rate (Rs./unit)","Amount (Rs.)"]);
  let sr=0,first=true;
  for(const {a,items} of areas){
    const body=[[{content:"",styles:gridCell},{content:a.name||"Area",colSpan:8,styles:{fontStyle:"bold",...gridCell}}]];
    for(const r of items){sr++;body.push(itemCells(r,C.rows[r.id],sr,mode))}
    const tot=mode==="client"?C.areas[a.id].c:mode==="vendor"?C.areas[a.id].v:null;
    body.push([{content:"Sub-total - "+(a.name||"Area"),colSpan:8,styles:{fillColor:BLK,textColor:255,fontStyle:"bolditalic",halign:"center",...gridCell}},{content:tot!=null?rs(tot):"",styles:{fillColor:BLK,textColor:255,fontStyle:"bold",halign:"right",...gridCell}}]);
    const est=body.length*6.6+(first?10:0);
    if(y+est>282){doc.addPage();y=14;first=true}   // keep an area together with its sub-total
    y=T(doc,{startY:y,head:first?head:undefined,showHead:first?"everyPage":"never",body,columnStyles:COLS9});
    first=false;
  }
  const totA=mode==="client"?C.Ac:mode==="vendor"?C.Av:null;
  y=room(doc,y+3,10);
  return T(doc,{startY:y,body:[[{content:"TOTAL FURNITURE (A)",colSpan:8,styles:{fillColor:SAGE,fontStyle:"bold",halign:"center"}},{content:totA!=null?rs(totA):"",styles:{fillColor:SAGE,fontStyle:"bold",halign:"right"}}]],columnStyles:COLS9})+5;
}
function sectionB(doc,y,q,C,mode){
  const svc=q.services.filter(r=>r.item.trim());if(!svc.length)return y;
  y=bar(doc,y,"B.  ADDITIONAL SERVICES",BEIGE,{need:24,indent:22});
  const body=svc.map((r,i)=>{const o=C.rows[r.id];const size=r.unit==="LS"?"":` (${fmtIn(o.qty)} ${r.unit})`;
    const amt=mode==="client"?o.c:mode==="vendor"?o.v:null;
    return [{content:roman(i+1),styles:{halign:"center",...gridCell}},{content:r.item+size,styles:gridCell},{content:amt!=null&&amt?rs(amt):"",styles:{halign:"right",fontStyle:"bold",...gridCell}}]});
  const tot=mode==="client"?C.Bc:mode==="vendor"?C.Bv:null;
  body.push([{content:"TOTAL - ADDITIONAL SERVICES (B)",colSpan:2,styles:{fillColor:SAGE,fontStyle:"bold",halign:"center"}},{content:tot!=null?rs(tot):"",styles:{fillColor:SAGE,fontStyle:"bold",halign:"right"}}]);
  return T(doc,{startY:y,head:[[{content:"Sr.No.",styles:{fillColor:SAGE,fontStyle:"bold",halign:"center",fontSize:8.5,...gridCell}},{content:"Description",styles:{fillColor:SAGE,fontStyle:"bold",fontSize:8.5,...gridCell}},{content:"Amount (Rs.)",styles:{fillColor:SAGE,fontStyle:"bold",halign:"center",fontSize:8.5,...gridCell}}]],showHead:"everyPage",body,columnStyles:{0:{cellWidth:11},1:{cellWidth:"auto"},2:{cellWidth:23}}})+5;
}
const safe=s=>String(s||"").replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"_").slice(0,50);
function makeClientPDF(q){
  const C=compute(q),doc=newDoc();let y=brandHeader(doc);
  y=detailsBlock(doc,y,[["Client Name",q.client.name],["Site Address / Location",q.client.site],["Type",typeLabel(q.client)],["Quotation No.",q.no],["Quotation Date",fmtDate(q.date)],["Prepared By (Designer / Signatory)",q.client.preparedBy],["Contact No. / Email",q.client.contact]]);
  y=sectionA(doc,y,q,C,"client");y=sectionB(doc,y,q,C,"client");
  // summary
  const S=q.settings,box={...gridCell,halign:"right",fontStyle:"bold"};
  const sum=[[{content:"SUB-TOTAL (A + B)",styles:{fontStyle:"bold",halign:"right"}},"",{content:rs(C.sub),styles:box}]];
  if(C.design||S.designValue){sum.push([{content:S.designMode==="fixed"?"Professional Design Consultancy Charges":"Professional Design Consultancy Charges - % of "+(S.designMode==="pctVendor"?"project cost":"Sub-total"),styles:{fontStyle:"italic",halign:"right"}},{content:S.designMode==="fixed"?"":fmtIn(+S.designValue||0)+"%",styles:{...gridCell,halign:"center",fontStyle:"bold"}},{content:rs(C.design),styles:box}])}
  sum.push([{content:"Discount (if any) - % of Sub-total",styles:{fontStyle:"italic",halign:"right"}},{content:fmtIn(+S.discount||0)+"%",styles:{...gridCell,halign:"center",fontStyle:"bold"}},{content:C.disc?"- "+rs(C.disc):"-",styles:box}]);
  if(C.gst)sum.push([{content:"Add: GST",styles:{fontStyle:"italic",halign:"right"}},{content:fmtIn(+S.gst)+"%",styles:{...gridCell,halign:"center",fontStyle:"bold"}},{content:rs(C.gst),styles:box}]);
  sum.push([{content:"GRAND TOTAL (Rs.)",colSpan:2,styles:{fillColor:NAVY,textColor:255,fontStyle:"bold",halign:"center"}},{content:rs(C.grand),styles:{fillColor:NAVY,textColor:255,fontStyle:"bold",halign:"right"}}]);
  y=room(doc,y,30);
  y=T(doc,{startY:y,body:sum,columnStyles:{0:{cellWidth:"auto"},1:{cellWidth:21},2:{cellWidth:23}}})+6;
  // payment schedule
  const pays=C.payments.filter(p=>(p.label||"").trim()||p.pct);
  if(pays.length){y=bar(doc,y,"PAYMENT SCHEDULE",BEIGE,{need:10+pays.length*6,indent:3});
    y=T(doc,{startY:y,body:pays.map(p=>[p.label,{content:fmtIn(+p.pct||0)+"%",styles:{...gridCell,halign:"center",fontStyle:"bold"}},{content:rs(p.amt),styles:{...gridCell,halign:"right",fontStyle:"bold"}}]),columnStyles:{0:{cellWidth:"auto",cellPadding:{left:3,top:1.1,bottom:1.1}},1:{cellWidth:21},2:{cellWidth:23}}})+4}
  if((q.terms.note||"").trim()){y=room(doc,y,14);y=T(doc,{startY:y,body:[[{content:q.terms.note.trim(),styles:{fillColor:SAGE,fontStyle:"bold",cellPadding:{left:3,right:50,top:2,bottom:2}}}]]})+5}
  const tcs=(q.terms.tc||"").split("\n").map(s=>s.trim()).filter(Boolean);
  if(tcs.length){y=bar(doc,y,"TERMS & CONDITIONS",BEIGE,{need:20,indent:3});
    y=T(doc,{startY:y+1,body:tcs.map(t=>[{content:"•",styles:{halign:"right"}},t.replace(/^[•\-]\s*/,"")]),columnStyles:{0:{cellWidth:7},1:{cellWidth:120}},styles:{font:"Carlito",fontSize:9,cellPadding:{top:0.7,bottom:0.7,left:1.2,right:1}}})+5}
  const specs=(q.terms.specs||"").split("\n").map(s=>s.trimEnd()).filter(s=>s.trim());
  if(specs.length){y=bar(doc,y,"MATERIAL SPECIFICATIONS",BEIGE,{need:20,indent:3});
    y=T(doc,{startY:y+0.5,body:specs.map(s=>s.trim().startsWith("#")?[{content:s.replace(/^#+\s*/,""),styles:{fillColor:SUBT,textColor:SUBT_INK,fontStyle:"bold",cellPadding:{left:3,top:1,bottom:1}}}]:[{content:s.trim().startsWith("-")?s.trim():"-  "+s.trim(),styles:{cellPadding:{left:3,top:0.7,bottom:0.7}}}]),columnStyles:{0:{cellWidth:127}}})+4}
  const bold=[q.terms.exclusions,q.terms.binding].map(s=>(s||"").trim()).filter(Boolean);
  if(bold.length){y=room(doc,y,16);y=T(doc,{startY:y,body:bold.map(s=>[{content:s,styles:{fontStyle:"bolditalic",cellPadding:{left:3,top:1.5,bottom:1.5}}}]),columnStyles:{0:{cellWidth:127}}})+6}
  // signature
  y=room(doc,y,36);doc.setFont("Carlito","bold");doc.setFontSize(9.5);doc.setTextColor(0);
  doc.text("Client Acceptance",PL+3,y);doc.text("For ANTARIKSHA INTERIORS",PL+PW-3,y,{align:"right"});
  y+=20;doc.setDrawColor(...NAVY);doc.setLineWidth(0.6);doc.line(PL,y,PL+PW,y);
  doc.setFont("Carlito","italic");doc.setFontSize(9);doc.text("Client's Signature & Name",PL+3,y+5);doc.text("Authorised Signatory",PL+PW-3,y+5,{align:"right"});
  footer(doc,"Quotation "+(q.no||""));
  doc.save(`Quotation_${safe(q.no)}_${safe(q.client.name)}.pdf`);
  toast("Client quotation downloaded");
}
function makeVendorPDF(q,measure){
  const C=compute(q),doc=newDoc(),mode=measure?"measure":"vendor";let y=brandHeader(doc);
  y=bar(doc,y,measure?"MEASUREMENT SHEET - PLEASE FILL RATE & AMOUNT":"VENDOR QUOTATION",NAVY,{ink:[255,255,255],size:10.5,indent:3})+1;
  y=T(doc,{startY:y,body:[["Project",q.client.name],["Site",q.client.site],["Reference No.",q.no],["Date",fmtDate(q.date)]],columnStyles:{0:{cellWidth:40,fontStyle:"bold",cellPadding:{left:3,top:1,bottom:1}},1:{fontStyle:"bold"}},styles:{font:"Carlito",fontSize:10,cellPadding:1}})+4;
  y=sectionA(doc,y,q,C,mode);y=sectionB(doc,y,q,C,mode);
  y=room(doc,y,14);
  y=T(doc,{startY:y,body:[[{content:"TOTAL VENDOR AMOUNT (A + B)",styles:{fillColor:NAVY,textColor:255,fontStyle:"bold",halign:"center"}},{content:measure?"":rs(C.vendorTotal),styles:{fillColor:NAVY,textColor:255,fontStyle:"bold",halign:"right"}}]],columnStyles:{0:{cellWidth:"auto"},1:{cellWidth:23}}})+8;
  if(measure){y=room(doc,y,30);doc.setFont("Carlito","italic");doc.setFontSize(9);doc.setTextColor(0);
    doc.text("Please quote either a per sq.ft rate or a final amount for each item, and return this sheet.",PL+3,y);
    y+=16;doc.setDrawColor(...NAVY);doc.setLineWidth(0.5);doc.line(PL+PW-70,y,PL+PW,y);doc.text("Vendor name, signature & date",PL+PW,y+5,{align:"right"})}
  footer(doc,(measure?"Measurement sheet ":"Vendor quotation ")+(q.no||""));
  doc.save(`${measure?"Measurement":"Vendor"}_${safe(q.no)}_${safe(q.client.name)}.pdf`);
  toast(measure?"Measurement sheet downloaded":"Vendor quotation downloaded");
}
</script>
<script>
/* ===================== Excel import (from your Quotation Master) ===================== */
async function importExcel(file){
  if(!window.XLSX)throw new Error("Excel reader did not load");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const vs=wb.Sheets["Vendor Sheet"];if(!vs)throw new Error('This file has no "Vendor Sheet"');
  const mm=wb.Sheets["My Margin"],qs=wb.Sheets["Quote Settings"];
  const cv=(ws,a)=>{if(!ws)return null;const c=ws[a];return c?c.v:null};
  const rows=XLSX.utils.sheet_to_json(vs,{header:1,raw:true,defval:null});
  let hdr=rows.findIndex(r=>r&&r.some(v=>String(v||"").startsWith("Item / Description")));if(hdr<0)hdr=5;
  const mode=String(cv(mm,"N3")||"Auto");
  const q=blankQuote(await nextQuoteNo());q.areas=[];q.services=[];
  let area=null;
  for(let i=hdr+1;i<rows.length;i++){const r=rows[i]||[];
    if(String(r[0]||"").toUpperCase().startsWith("TOTAL"))break;
    const item=String(r[2]??"").trim();if(!item)continue;
    let unit=String(r[3]??"").trim()||"Sq.ft";if(!UNITS.includes(unit))unit=unit.toUpperCase()==="LS"?"LS":/r/i.test(unit)?"Rft":/no/i.test(unit)?"Nos":"Sq.ft";
    const amt=num(r[8]),rate=num(r[9]);let m=num(r[12]);if(m!=null&&Math.abs(m)<=1)m=m*100;
    const row={...newRow(unit),item,l:num(r[4]),w:num(r[5]),nos:num(r[6]),margin:m};
    const useRate=mode==="Vendor Rate"||(mode!=="Vendor Amount"&&!(amt>0)&&rate>0);
    if(useRate){row.basis="rate";row.rate=rate}else{row.basis="amt";row.amt=amt}
    const aname=String(r[1]??"").trim();
    if(unit==="LS"){q.services.push(row);continue}
    if(aname||!area){area={id:uid(),name:aname||"Area",margin:null,items:[]};q.areas.push(area)}
    area.items.push(row);
  }
  if(!q.areas.length)q.areas.push(newArea(""));
  if(mm){const s=a=>{const v=cv(mm,a);return v==null?"":v instanceof Date?v:String(v)};
    q.client.name=s("C3");q.client.site=s("C4");q.client.type=s("C5")||q.client.type;if(s("C6"))q.no=s("C6");
    const d=cv(mm,"C7");if(d instanceof Date)q.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(s("C8"))q.client.preparedBy=s("C8");if(s("C9"))q.client.contact=s("C9");
    const pct=a=>{const v=num(cv(mm,a));return v==null?null:Math.round(v*100*1000)/1000};
    q.settings={...q.settings,margin:pct("N4")??q.settings.margin,roundTo:num(cv(mm,"N5"))??q.settings.roundTo,discount:pct("N6")??0,gst:pct("N7")??0,designMode:"pctClient",designValue:pct("N8")??q.settings.designValue};
  }
  if(qs){const qr=XLSX.utils.sheet_to_json(qs,{header:1,raw:true,defval:null});
    const pays=[],tc=[],specs=[],bt=[],notes=[];let sec="";let btGroup=[];
    for(const r of qr){const type=String(r[0]||"").trim(),txt=String(r[1]??"").trim(),show=r[4];
      if(type==="title"){sec=txt.toUpperCase();continue}
      if(type==="blank"){if(btGroup.length){bt.push(btGroup.join(" "));btGroup=[]}continue}
      if(!txt||show===0)continue;
      if(type==="pay")pays.push({label:txt,pct:Math.round((num(r[2])||0)*100*100)/100});
      else if(type==="note")notes.push(txt);
      else if(type==="subtitle")specs.push("# "+txt);
      else if(type==="text"&&sec.startsWith("TERMS")){if(/^[•\-]/.test(txt)||!tc.length)tc.push(txt.replace(/^[•]\s*/,""));else tc[tc.length-1]+=" "+txt}
      else if(type==="text"&&sec.startsWith("MATERIAL"))specs.push(txt.startsWith("-")?txt:"- "+txt);
      else if(type==="btext")btGroup.push(txt);
    }
    if(btGroup.length)bt.push(btGroup.join(" "));
    if(pays.length)q.terms.payments=pays;if(notes.length)q.terms.note=notes.join(" ");if(tc.length)q.terms.tc=tc.join("\n");if(specs.length)q.terms.specs=specs.join("\n");
    if(bt[0])q.terms.exclusions=bt[0];if(bt[1])q.terms.binding=bt[1];
  }
  return q;
}
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  toast("Reading "+f.name+"…");
  try{const q=await importExcel(f);openQuote(q);await saveNow();toast("Imported. Check the items, then download the PDF.")}
  catch(err){console.error(err);toast("Could not import: "+err.message)}};

/* ===================== sign-in & boot ===================== */
(()=>{
  $("gateLogo").src=WORDMARK;$("hdrMark").src=MARK;
  const gate=$("gate"),app=$("app"),msg=$("gateMsg"),btn=$("signIn");
  const show=s=>{gate.hidden=s;app.hidden=!s};
  if(!window.firebase){show(false);msg.textContent="Could not load. Check your internet connection and reload.";return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
  btn.onclick=async()=>{msg.textContent="Opening Google sign-in…";try{await auth.signInWithPopup(provider)}catch(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(provider);
    else msg.textContent=e&&e.code==="auth/popup-closed-by-user"?"Sign-in was closed. Try again.":"Sign-in failed: "+((e&&e.message)||"unknown error")}};
  $("signOut").onclick=()=>auth.signOut();
  let started=false,denied="";
  auth.onAuthStateChanged(async u=>{
    if(!u){show(false);btn.hidden=false;msg.textContent=denied||"Sign in to open your quotations.";denied="";return}
    if((u.email||"").toLowerCase()!==ALLOWED_EMAIL.toLowerCase()){denied=(u.email||"This account")+" does not have access. Sign in with the business Google account.";await auth.signOut();return}
    $("who").textContent=u.email;show(true);if(started)return;started=true;
    try{const d=await fs.doc("settings/quoteDefaults").get();if(d.exists)defaults=d.data()}catch(e){}
    fs.collection("quotes").orderBy("updatedAt","desc").onSnapshot(s=>{quotes=s.docs.map(d=>d.data());renderList()},
      e=>{$("qList").innerHTML=`<tr><td colspan="9"><div class="empty"><b>Could not load quotations</b>${esc(e&&e.code||"")} · check the Firestore rules and reload.</div></td></tr>`});
  });
})();
